name: CI

on:
  push:
    branches: [main]
  pull_request:

# Each action is pinned to one exact commit: a tag such as "v4" can be moved by whoever
# controls the action, a commit cannot. Dependabot proposes the updates.
permissions:
  contents: read

jobs:
  quality:
    name: Style, analyse statique, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Style (Pint)
        run: vendor/bin/pint --test

      - name: Analyse statique (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Failles connues dans les dépendances
        run: composer audit

  assets:
    name: Compilation des assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

  tests-sqlite:
    name: Tests SQLite (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate

      - name: Tests
        run: php artisan test

  tests-mysql:
    name: Tests MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: triage_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # Real environment variables take precedence over the values in phpunit.xml.
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: triage_test
      DB_USERNAME: root
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate

      - name: Tests
        run: php artisan test

  mobile:
    name: Application mobile (tests et compilation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The Gradle dependencies are kept between runs: without this cache every run
      # downloads them again, and Maven Central ends up refusing the requests (error 429).
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mobile/**/*.gradle.kts
            mobile/gradle/libs.versions.toml
            mobile/gradle/wrapper/gradle-wrapper.properties

      - name: Tests du client de l'API (Kotlin pur)
        run: ./gradlew :core:test --no-daemon

      - name: Compilation de l'application Android
        run: ./gradlew :app:assembleDebug --no-daemon

  mobile-emulator:
    name: Application mobile sur émulateur (parcours complet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The Laravel server the application will talk to, with the demonstration data.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress --no-dev

      - name: Serveur Triage avec les données de démonstration
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=mysql/DB_CONNECTION=sqlite/; /^DB_HOST=/d; /^DB_PORT=/d; /^DB_DATABASE=/d; /^DB_USERNAME=/d; /^DB_PASSWORD=/d' .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --seed --force
          nohup php artisan serve --host=0.0.0.0 --port=8000 > serve.log 2>&1 &
          sleep 3
          curl --fail --silent --output /dev/null http://127.0.0.1:8000/up

      # The Gradle dependencies are kept between runs: without this cache every run
      # downloads them again, and Maven Central ends up refusing the requests (error 429).
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mobile/**/*.gradle.kts
            mobile/gradle/libs.versions.toml
            mobile/gradle/wrapper/gradle-wrapper.properties

      # Hardware acceleration, needed by the emulator on GitHub runners.
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Parcours du technicien sur un émulateur
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: mobile
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon

      # The test saves one screenshot per step: download them from the page of the run.
      # Published after a failure too, with the test report: the last screenshot shows where it stopped.
      - name: Captures d'écran et rapport du test
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: captures-application-mobile
          path: |
            mobile/app/build/outputs/connected_android_test_additional_output/
            mobile/app/build/reports/androidTests/
          if-no-files-found: warn

      - name: Journal du serveur en cas d'échec
        if: failure()
        run: tail -n 60 serve.log || true
